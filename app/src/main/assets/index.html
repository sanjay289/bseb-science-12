<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>विज्ञान 12 BSEB</title>
<style>
  :root { --blue:#0F6E5C; --bg:#F4F6FA; --card:#fff; --ink:#1b1f27; --muted:#5d6675; --ok:#1d7a3a; --bad:#b3261e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui, "Noto Sans Devanagari", sans-serif; background:var(--bg); color:var(--ink); font-size:17px; line-height:1.5; }
  header { background:var(--blue); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:1; }
  header h1 { font-size:19px; margin:0; flex:1; }
  header button { background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:8px; padding:6px 12px; font-size:15px; }
  main { padding:14px 16px 40px; max-width:720px; margin:0 auto; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tabs a { flex:1; text-align:center; padding:10px 4px; border-radius:10px; background:var(--card); color:var(--blue); text-decoration:none; font-weight:600; font-size:15px; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .tabs a.on { background:var(--blue); color:#fff; }
  .card { background:var(--card); border-radius:12px; padding:14px; margin-bottom:10px; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  a.card { display:flex; align-items:center; gap:12px; color:inherit; text-decoration:none; }
  .num { background:var(--blue); color:#fff; border-radius:50%; width:34px; height:34px; flex:none; display:flex; align-items:center; justify-content:center; font-weight:700; }
  .sub { color:var(--muted); font-size:14px; }
  h2 { font-size:20px; margin:4px 0 12px; color:var(--blue); }
  ul.notes { padding-left:20px; margin:0; }
  ul.notes li { margin-bottom:8px; }
  table { border-collapse:collapse; width:100%; font-size:15px; }
  td, th { border:1px solid #d5dbe5; padding:6px; text-align:center; }
  th { background:#e3f2ee; }
  .btn { display:block; width:100%; background:var(--blue); color:#fff; border:0; border-radius:10px; padding:13px; font-size:17px; font-weight:600; margin-top:10px; text-align:center; text-decoration:none; }
  .btn.ghost { background:var(--card); color:var(--blue); border:2px solid var(--blue); }
  .opt { display:block; width:100%; text-align:left; background:var(--card); border:2px solid #d5dbe5; border-radius:10px; padding:12px; margin-bottom:8px; font-size:17px; color:var(--ink); }
  .opt.right { border-color:var(--ok); background:#e6f4ea; }
  .opt.wrong { border-color:var(--bad); background:#fce8e6; }
  .bar { display:flex; justify-content:space-between; color:var(--muted); font-size:14px; margin-bottom:8px; }
  .explain { border-left:4px solid var(--ok); padding:8px 12px; background:#f0f7f2; border-radius:6px; margin-top:6px; }
  .big { font-size:44px; font-weight:800; color:var(--blue); text-align:center; margin:10px 0 0; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
  .grid a.card { flex-direction:column; text-align:center; gap:4px; margin:0; padding:18px 10px; }
  .emo { font-size:36px; }
  .review { border-left:4px solid var(--bad); }
  .ans { color:var(--ok); font-weight:600; }
</style>
</head>
<body>
<header>
  <a id="back" href="#/" style="color:#fff;text-decoration:none;font-size:22px;display:none">←</a>
  <h1 id="title"></h1>
  <button onclick="toggleLang()" id="langBtn"></button>
</header>
<main id="app"></main>

<script>const SUBJECTS = [];</script>
<script src="data/physics.js"></script>
<script src="data/chemistry.js"></script>
<script src="data/biology.js"></script>
<script src="data/math.js"></script>
<script src="app.js"></script>
</body>
</html>
